<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Gun Fight</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#111;color:white;font-family:Arial,sans-serif;text-align:center}
  h1{margin:12px 0 4px;font-size:28px}
  #hud{display:flex;justify-content:center;gap:28px;font-size:18px;margin:8px}
  canvas{background:linear-gradient(#24344d,#16202d);border:3px solid #fff;border-radius:10px;max-width:96vw}
  #controls{margin:10px auto;max-width:520px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  button{font-size:20px;padding:12px;border:0;border-radius:10px;background:#2e7dff;color:#fff}
  #restart{background:#e65151;display:none}
  .hint{font-size:14px;color:#bbb;margin:6px}
</style>
</head>
<body>
<h1>🔫 Pixel Gun Fight</h1>
<div id="hud">
  <span>❤️ HP: <b id="hp">100</b></span>
  <span>⭐ Score: <b id="score">0</b></span>
  <span>🎯 Enemies: <b id="enemies">0</b></span>
</div>
<canvas id="game" width="520" height="620"></canvas>
<div class="hint">Keyboard: A/D move • Space shoot • R restart</div>
<div id="controls">
  <button ontouchstart="move(-1)" onmousedown="move(-1)">◀</button>
  <button ontouchstart="shoot()" onmousedown="shoot()">🔥 FIRE</button>
  <button ontouchstart="move(1)" onmousedown="move(1)">▶</button>
  <button id="restart" onclick="restart()">Restart</button>
</div>

<script>
const c=document.getElementById("game"),ctx=c.getContext("2d");
let player, bullets, enemyBullets, enemies, score, gameOver, keys={}, spawnTimer=0, shootCooldown=0;

function restart(){
  player={x:240,y:555,w:40,h:40,hp:100};
  bullets=[]; enemyBullets=[]; enemies=[]; score=0; gameOver=false;
  document.getElementById("restart").style.display="none";
}
restart();

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.code==="Space"){e.preventDefault();shoot()}
  if(e.key.toLowerCase()==="r" && gameOver)restart();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function move(dir){ if(!gameOver) player.x=Math.max(5,Math.min(c.width-player.w-5,player.x+dir*38)); }
function shoot(){
  if(gameOver || shootCooldown>0)return;
  bullets.push({x:player.x+player.w/2-3,y:player.y-8,w:6,h:14,s:8});
  shootCooldown=12;
}

function spawnEnemy(){
  const x=20+Math.random()*(c.width-60);
  enemies.push({x,y:40,w:38,h:38,hp:2,t:0});
}

function hit(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}

function update(){
  if(gameOver)return;
  if(keys["a"]||keys["arrowleft"])player.x-=4;
  if(keys["d"]||keys["arrowright"])player.x+=4;
  player.x=Math.max(5,Math.min(c.width-player.w-5,player.x));

  if(shootCooldown>0)shootCooldown--;
  spawnTimer--;
  if(spawnTimer<=0){spawnEnemy();spawnTimer=55-Math.min(score,30);}

  bullets.forEach(b=>b.y-=b.s);
  bullets=bullets.filter(b=>b.y>-20);

  enemies.forEach(e=>{
    e.t++;
    e.y += 0.65;
    if(e.t%90===0)enemyBullets.push({x:e.x+e.w/2-3,y:e.y+e.h,w:6,h:12,s:4});
    if(e.y>c.height){e.y=20;e.x=20+Math.random()*(c.width-60);}
  });

  enemyBullets.forEach(b=>b.y+=b.s);
  enemyBullets=enemyBullets.filter(b=>b.y<c.height+20);

  for(let i=bullets.length-1;i>=0;i--){
    for(let j=enemies.length-1;j>=0;j--){
      if(hit(bullets[i],enemies[j])){
        enemies[j].hp--; bullets.splice(i,1);
        if(enemies[j].hp<=0){enemies.splice(j,1);score+=10;}
        break;
      }
    }
  }

  for(const b of enemyBullets){
    if(hit(b,player)){player.hp-=10;b.y=c.height+50;}
  }
  for(const e of enemies){
    if(hit(e,player)){player.hp-=20;e.y=20;e.x=20+Math.random()*(c.width-60);}
  }
  if(player.hp<=0){
    player.hp=0;gameOver=true;
    document.getElementById("restart").style.display="inline-block";
  }
  document.getElementById("hp").textContent=player.hp;
  document.getElementById("score").textContent=score;
  document.getElementById("enemies").textContent=enemies.length;
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  // stars
  ctx.fillStyle="#fff";
  for(let i=0;i<45;i++){
    const x=(i*97)%c.width,y=(i*53)%c.height;
    ctx.fillRect(x,y,2,2);
  }
  // player
  ctx.fillStyle="#35d07f";ctx.fillRect(player.x,player.y,player.w,player.h);
  ctx.fillStyle="#173d2a";ctx.fillRect(player.x+9,player.y+8,22,12);
  ctx.fillStyle="#ffd166";ctx.fillRect(player.x+16,player.y-10,8,12);

  // bullets
  ctx.fillStyle="#ffe66d";
  bullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
  ctx.fillStyle="#ff8c8c";
  enemyBullets.forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));

  // enemies
  enemies.forEach(e=>{
    ctx.fillStyle="#e85d75";ctx.fillRect(e.x,e.y,e.w,e.h);
    ctx.fillStyle="#401c28";ctx.fillRect(e.x+7,e.y+8,24,10);
    ctx.fillStyle="#ffcf66";ctx.fillRect(e.x+16,e.y+e.h,6,10);
    ctx.fillStyle="#222";ctx.fillRect(e.x,e.y-7,e.w,4);
    ctx.fillStyle="#6ee7b7";ctx.fillRect(e.x,e.y-7,e.w*(e.hp/2),4);
  });

  if(gameOver){
    ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle="#fff";ctx.textAlign="center";
    ctx.font="bold 42px Arial";ctx.fillText("GAME OVER",c.width/2,270);
    ctx.font="24px Arial";ctx.fillText("Score: "+score,c.width/2,315);
    ctx.font="18px Arial";ctx.fillText("Press R or tap Restart",c.width/2,350);
  }
}

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
